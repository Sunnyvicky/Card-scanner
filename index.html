<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123a75">
  <title>名脈 MingMai</title>
  <link rel="icon" href="mingmai-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="mingmai-icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{--navy:#123a75;--blue:#2563eb;--sky:#eaf3ff;--ink:#172033;--muted:#697386;--line:#e5e9f0;--bg:#f5f7fb;--danger:#c83636;--good:#087d58}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:ui-sans-serif,system-ui,"Noto Sans TC",Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.55;cursor:not-allowed}.app{max-width:760px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 30px #1d355715}.top{position:sticky;top:0;z-index:5;padding:17px 20px 14px;background:#fffdfdE8;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:-.8px;color:var(--navy);font-size:22px}.brand small{font-size:10px;letter-spacing:1px;color:#e77b28;margin-left:5px}.icon{width:38px;height:38px;border-radius:12px;background:#f1f5f9;color:var(--navy);font-size:19px}.content{padding:18px 18px 108px}.hero{background:linear-gradient(125deg,#123a75,#2563eb);padding:22px;border-radius:22px;color:#fff;margin-bottom:16px}.hero h1{margin:0 0 6px;font-size:23px}.hero p{margin:0;color:#dbeafe;font-size:14px;line-height:1.55}.primary,.secondary,.ghost,.danger{border-radius:13px;padding:12px 15px;font-weight:750}.primary{background:var(--blue);color:#fff;box-shadow:0 7px 16px #2563eb40}.secondary{background:var(--sky);color:#164f9d}.ghost{background:#f5f6f8;color:#4a5568}.danger{background:#fff1f1;color:#c83636}.wide{width:100%}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.between{justify-content:space-between}.grow{flex:1}.search{position:relative;margin:14px 0}.search input{width:100%;padding:13px 38px 13px 15px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:none}.search input:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:#77a8f9;box-shadow:0 0 0 3px #dbeafe;outline:0}.clear-search{position:absolute;right:6px;top:5px;background:transparent;color:#94a3b8;font-size:18px}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:#fff;padding:7px 11px;font-size:12px;color:#526071}.chip.active{background:var(--navy);border-color:var(--navy);color:#fff}.toolbar{font-size:13px;color:var(--muted);margin:0 0 12px}.toolbar select{border:0;background:transparent;color:var(--navy);font-weight:700}.card{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:17px;padding:13px;margin:10px 0;background:#fff}.card:active{background:#f8fbff}.avatar{width:49px;height:49px;border-radius:15px;object-fit:cover;background:#deebff;display:grid;place-items:center;font-weight:800;color:var(--navy);flex:none}.card-main{min-width:0;flex:1}.card-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-sub{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.star{background:transparent;color:#f2a51a;font-size:20px;padding:5px}.empty{text-align:center;padding:46px 20px;color:var(--muted)}.empty .big{font-size:42px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);padding:12px 18px max(12px,env(safe-area-inset-bottom));background:#fffdfdE8;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;gap:10px;z-index:5}.bottom button{flex:1}.sheet{display:none}.sheet.show{display:block}.form-title{font-size:21px;font-weight:900;margin:1px 0 18px}.notice{border-radius:13px;padding:12px 13px;font-size:13px;line-height:1.5;background:#fff7e6;color:#855b11;margin:12px 0}.notice.info{background:#eef6ff;color:#24568f}.notice.good{background:#eafaf4;color:#126549}.images{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:10px}.image-slot{position:relative;aspect-ratio:1.58;border:1.5px dashed #aebdce;border-radius:16px;overflow:hidden;background:#f7f9fc;display:grid;place-items:center;color:#607086;text-align:center;font-size:13px}.image-slot img{width:100%;height:100%;object-fit:cover}.image-slot input{display:none}.image-slot label{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer;background:linear-gradient(#ffffff60,#ffffff60)}.image-slot.has img+label{inset:auto 7px 7px auto;background:#172033c9;color:#fff;padding:6px 9px;border-radius:9px;font-size:12px}.remove-image{position:absolute;top:7px;right:7px;border-radius:50%;background:#172033d9;color:#fff;width:25px;height:25px;z-index:2}.camera-tools{display:flex;gap:10px;margin:0 0 12px}.camera-tools button{flex:1;font-size:13px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:750;color:#58667a;margin:0 0 6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink)}.field textarea{min-height:84px;resize:vertical}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section{border:1px solid var(--line);border-radius:17px;padding:15px;margin:14px 0}.section h2{font-size:15px;margin:0 0 9px}.dupes{border:1px solid #f7d38d;background:#fffaf0;border-radius:13px;padding:11px;font-size:13px}.dupes button{background:transparent;color:#1d62bc;font-weight:750;text-decoration:underline;padding:2px}.loading{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:#ffffffdc;text-align:center;padding:30px}.loading.show{display:grid}.spinner{width:45px;height:45px;border:4px solid #cfe0ff;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#172033;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;z-index:30;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;z-index:15;background:#17203375;display:none;align-items:end}.modal.show{display:flex}.modal-box{width:min(760px,100%);max-height:85vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:20px}.modal-box h2{margin:0 0 8px}.settings-note{font-size:13px;color:var(--muted);line-height:1.55}.small{font-size:12px;color:var(--muted)}.link{color:#1764bd;font-weight:700;text-decoration:none}.camera{position:fixed;inset:0;z-index:40;background:#071426;display:none;color:#fff;flex-direction:column}.camera.show{display:flex}.camera-view{position:relative;flex:1;overflow:hidden;background:#000}.camera video{width:100%;height:100%;object-fit:cover}.camera-frame{position:absolute;width:86%;aspect-ratio:1.58;left:7%;top:50%;transform:translateY(-50%);border:3px solid #58b7ff;border-radius:18px;box-shadow:0 0 0 999px #0009,0 0 23px #58b7ff;pointer-events:none}.camera-frame:after{content:"將名片完整放入框內";position:absolute;bottom:-38px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#10294fc9;border-radius:999px;padding:7px 12px;font-size:12px}.camera-bar{height:116px;padding:14px 22px max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;background:#071426}.camera-capture{width:62px;height:62px;border-radius:50%;border:5px solid #dbeafe;background:#fff;box-shadow:0 0 0 4px #4ea6ff}.camera-cancel{background:transparent;color:#fff;font-weight:700;padding:12px}.hidden{display:none!important}@media(max-width:420px){.content{padding:15px}.pair{grid-template-columns:1fr}.hero{padding:19px}}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand">名脈 <small>MINGMAI</small></div><button class="icon" id="settingsBtn" aria-label="設定">⚙</button></header>
  <main class="content">
    <section id="homeView">
      <div class="hero"><h1>讓每張名片，都能延續關係。</h1><p>拍攝、校正、分類，再在適當的時候重新聯絡。</p></div>
      <div class="search"><input id="search" placeholder="搜尋姓名、公司、電話、Email、標籤或備註"><button id="clearSearch" class="clear-search hidden" aria-label="清除搜尋">×</button></div>
      <div class="chips" id="chips"></div>
      <div class="row between toolbar"><span id="count"></span><label>排序 <select id="sort"><option value="recent">最近更新</option><option value="contact">最近聯絡</option><option value="name">姓名</option><option value="company">公司</option></select></label></div>
      <div id="cardList"></div>
    </section>
    <section id="editorView" class="sheet">
      <div class="row between"><button id="backBtn" class="ghost">← 返回</button><button id="deleteBtn" class="danger hidden">刪除</button></div>
      <h1 class="form-title" id="editorTitle">新增名片</h1>
      <div class="notice info">先核對 AI 結果再儲存。電話、Email 與網址可直接點擊使用。</div>
      <div id="duplicateBox" class="dupes hidden"></div>
      <div class="images">
        <div class="image-slot" id="frontSlot"><img class="hidden"><label>＋ 名片正面<br><span class="small">從相簿選擇</span><input type="file" accept="image/*"></label><button class="remove-image hidden" type="button">×</button></div>
        <div class="image-slot" id="backSlot"><img class="hidden"><label>＋ 名片背面<br><span class="small">從相簿選擇</span><input type="file" accept="image/*"></label><button class="remove-image hidden" type="button">×</button></div>
      </div>
      <div class="camera-tools"><button id="openFrontCamera" class="primary">▣ 框選拍正面</button><button id="openBackCamera" class="secondary">▣ 框選拍背面</button></div>
      <button id="scanBtn" class="secondary wide">✨ 使用 AI 讀取正面名片</button>
      <div class="section"><h2>基本資料</h2>
        <div class="pair"><div class="field"><label>姓名</label><input data-field="name" placeholder="王小明"></div><div class="field"><label>職稱</label><input data-field="jobTitle" placeholder="業務經理"></div></div>
        <div class="field"><label>公司</label><input data-field="company" placeholder="範例科技股份有限公司"></div>
        <div class="pair"><div class="field"><label>手機</label><input data-field="mobile" inputmode="tel" placeholder="0912 345 678"></div><div class="field"><label>市話</label><input data-field="tel" inputmode="tel" placeholder="02 1234 5678"></div></div>
        <div class="pair"><div class="field"><label>分機</label><input data-field="extension" inputmode="numeric" placeholder="123"></div><div class="field"><label>傳真</label><input data-field="fax" inputmode="tel"></div></div>
        <div class="field"><label>Email</label><input data-field="email" type="email" placeholder="name@example.com"></div>
        <div class="field"><label>網站</label><input data-field="website" inputmode="url" placeholder="https://example.com"></div>
        <div class="field"><label>地址</label><input data-field="address" placeholder="台北市…"></div>
      </div>
      <div class="section"><h2>關係管理</h2>
        <div class="pair"><div class="field"><label>分類</label><select data-field="category"><option>工作－客戶</option><option>工作－廠商</option><option>朋友</option><option>家人</option><option>其他</option></select></div><div class="field"><label>狀態</label><select data-field="status"><option>待跟進</option><option>進行中</option><option>已聯絡</option><option>封存</option></select></div></div>
        <div class="field"><label>標籤（以逗號分隔）</label><input data-field="tagsText" placeholder="展覽, 2026, 潛在客戶"></div>
        <div class="field"><label>在哪裡認識／備註</label><textarea data-field="note" placeholder="例如：7/23 展場認識；九月再聯絡…"></textarea></div>
        <div class="row"><label class="row grow"><input data-field="favorite" type="checkbox"> 收藏這位聯絡人</label><button id="contactedBtn" class="ghost">標記今天已聯絡</button></div>
      </div>
      <div class="row"><button id="vcardBtn" class="secondary grow">加入通訊錄</button><button id="saveBtn" class="primary grow">儲存名片</button></div>
    </section>
  </main>
  <nav class="bottom" id="bottomNav"><button id="addBtn" class="primary">＋ 新增名片</button><button id="importBtn" class="ghost">匯入備份</button><button id="exportBtn" class="ghost">匯出備份</button><input id="importFile" type="file" accept="application/json,.json" class="hidden"></nav>
</div>
<div class="loading" id="loading"><div><div class="spinner"></div><p id="loadingText">處理中…</p></div></div><div id="toast" class="toast"></div>
<div class="modal" id="settingsModal"><div class="modal-box"><div class="row between"><h2>設定</h2><button class="icon close-modal">×</button></div>
  <div class="notice">AI Key 僅保留在此頁面記憶體，重新整理後會清除。此單檔版本會從你的瀏覽器直接呼叫 Gemini，請僅使用受限且可撤銷的個人 Key；若要公開上線，請改用後端代理服務。</div>
  <div class="field"><label>Google Gemini API Key（可選）</label><input id="apiKey" type="password" autocomplete="off" placeholder="AIza…"></div>
  <div class="field"><label>辨識模型</label><select id="model"><option value="">先測試並載入可用模型</option></select></div>
  <div class="row"><button id="testKeyBtn" class="secondary grow">測試 Key／取得模型</button><a class="ghost link" target="_blank" rel="noreferrer" href="https://aistudio.google.com/app/apikey">建立 Key</a></div><p id="keyStatus" class="settings-note"></p>
  <hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h2 style="font-size:16px">資料管理</h2><p class="settings-note">資料只保存在這台裝置的瀏覽器。請定期匯出 JSON 備份。</p><button id="clearAllBtn" class="danger">清除所有本機名片</button>
</div></div>
<div class="camera" id="cameraModal" aria-label="名片相機"><div class="camera-view" id="cameraView"><video id="cameraVideo" autoplay playsinline muted></video><div class="camera-frame" id="cameraFrame"></div></div><div class="camera-bar"><button id="cameraCancel" class="camera-cancel">取消</button><button id="cameraCapture" class="camera-capture" aria-label="拍攝名片"></button><span style="width:52px"></span></div></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const dbName='MingMai', storeName='cards'; let db, cards=[], activeId=null, state={}, aiKey='', models=[], cameraStream=null, cameraSide='front';
const categories=['全部','收藏','工作－客戶','工作－廠商','朋友','家人','其他']; let activeCategory='全部';
const defaults=()=>({name:'',jobTitle:'',company:'',mobile:'',tel:'',extension:'',fax:'',email:'',website:'',address:'',category:'工作－客戶',status:'待跟進',tags:[],tagsText:'',note:'',favorite:false,frontImage:'',backImage:'',createdAt:Date.now(),updatedAt:Date.now(),lastContactedAt:null});
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(dbName,2);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(storeName)){const s=d.createObjectStore(storeName,{keyPath:'id'});s.createIndex('updatedAt','updatedAt')} };r.onsuccess=e=>{db=e.target.result;resolve()};r.onerror=()=>reject(r.error)})}
function tx(mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction(storeName,mode),s=t.objectStore(storeName);const r=fn(s);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function load(){cards=await tx('readonly',s=>s.getAll());renderHome()}
async function put(card){await tx('readwrite',s=>s.put(card));await load()}
async function del(id){await tx('readwrite',s=>s.delete(id));await load()}
function toast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2700)}
function showLoading(text){$('#loadingText').textContent=text;$('#loading').classList.add('show')}function hideLoading(){$('#loading').classList.remove('show')}
const safe=v=>String(v||'').toLocaleLowerCase();
function cardMatches(c,q){const hay=[c.name,c.jobTitle,c.company,c.mobile,c.tel,c.email,c.website,c.address,c.note,...(c.tags||[])].map(safe).join(' ');return hay.includes(safe(q))}
function renderHome(){const q=$('#search').value.trim(),sort=$('#sort').value;let list=cards.filter(c=>(activeCategory==='全部'||(activeCategory==='收藏'?c.favorite:c.category===activeCategory))&&cardMatches(c,q));list.sort((a,b)=>{if(sort==='name')return safe(a.name).localeCompare(safe(b.name),'zh-Hant');if(sort==='company')return safe(a.company).localeCompare(safe(b.company),'zh-Hant');if(sort==='contact')return (b.lastContactedAt||0)-(a.lastContactedAt||0);return (b.updatedAt||0)-(a.updatedAt||0)});$('#chips').innerHTML=categories.map(c=>`<button class="chip ${c===activeCategory?'active':''}" data-cat="${c}">${c}</button>`).join('');$$('[data-cat]').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;renderHome()});$('#clearSearch').classList.toggle('hidden',!q);$('#count').textContent=`${list.length} 張名片`;
$('#cardList').innerHTML=list.length?list.map(c=>`<article class="card" data-id="${c.id}"><div class="avatar">${c.frontImage?`<img src="${c.frontImage}" class="avatar" alt="">`:escapeHtml((c.name||c.company||'?').slice(0,1))}</div><div class="card-main"><div class="card-name">${escapeHtml(c.name||'未命名')}</div><div class="card-sub">${escapeHtml([c.company,c.jobTitle].filter(Boolean).join(' · ')||'尚未填寫公司')}</div></div><button class="star" data-star="${c.id}" aria-label="收藏">${c.favorite?'★':'☆'}</button></article>`).join(''):`<div class="empty"><div class="big">▧</div><h3>${q?'找不到符合的名片':'還沒有名片'}</h3><p>${q?'試試姓名、電話、Email 或標籤':'從拍攝一張名片開始。'}</p></div>`;$$('.card[data-id]').forEach(el=>el.onclick=e=>{if(!e.target.closest('[data-star]'))edit(el.dataset.id)});$$('[data-star]').forEach(b=>b.onclick=async e=>{e.stopPropagation();const c=cards.find(x=>x.id===b.dataset.star);await put({...c,favorite:!c.favorite,updatedAt:Date.now()})})}
function escapeHtml(x){return String(x||'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function showEditor(){activeId=null;state=defaults();fillEditor();$('#editorTitle').textContent='新增名片';$('#deleteBtn').classList.add('hidden');$('#homeView').classList.remove('show');$('#homeView').classList.add('hidden');$('#editorView').classList.add('show');$('#bottomNav').classList.add('hidden')}
function edit(id){activeId=id;const selected=cards.find(c=>String(c.id)===String(id));state={...defaults(),...selected,tagsText:(selected.tags||[]).join(', ')};fillEditor();$('#editorTitle').textContent='編輯名片';$('#deleteBtn').classList.remove('hidden');$('#homeView').classList.add('hidden');$('#editorView').classList.add('show');$('#bottomNav').classList.add('hidden')}
function fillEditor(){ $$('[data-field]').forEach(i=>{if(i.type==='checkbox')i.checked=!!state[i.dataset.field];else i.value=state[i.dataset.field]||''});renderImage('front');renderImage('back');findDuplicates() }
function home(){activeId=null;$('#editorView').classList.remove('show');$('#homeView').classList.remove('hidden');$('#bottomNav').classList.remove('hidden');renderHome()}
function renderImage(which){const key=which+'Image',slot=$('#'+which+'Slot'),img=slot.querySelector('img'),rm=slot.querySelector('.remove-image');if(state[key]){img.src=state[key];img.classList.remove('hidden');slot.classList.add('has');rm.classList.remove('hidden')}else{img.src='';img.classList.add('hidden');slot.classList.remove('has');rm.classList.add('hidden')}}
async function resize(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');const im=new Image(),url=URL.createObjectURL(file);im.onload=()=>{URL.revokeObjectURL(url);const max=1440;let{width:w,height:h}=im;if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',.76))};im.onerror=reject;im.src=url})}
async function imageChange(which,file){try{showLoading('正在最佳化圖片…');state[which+'Image']=await resize(file);renderImage(which);findDuplicates()}catch{toast('圖片處理失敗，請換一張再試')}finally{hideLoading()}}
function closeCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}$('#cameraVideo').srcObject=null;$('#cameraModal').classList.remove('show')}
async function openCamera(which){
  if(!navigator.mediaDevices?.getUserMedia){toast('此瀏覽器不支援框選相機，請改用相簿選擇');return}
  cameraSide=which;
  try{
    cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    const video=$('#cameraVideo');video.srcObject=cameraStream;$('#cameraModal').classList.add('show');await video.play();
  }catch(e){closeCamera();toast('無法開啟相機；請允許相機權限，或改用相簿選擇')}
}
function captureCard(){
  const video=$('#cameraVideo'), view=$('#cameraView'), frame=$('#cameraFrame');
  if(!video.videoWidth||!video.videoHeight){toast('相機尚未準備好');return}
  const viewRect=view.getBoundingClientRect(), frameRect=frame.getBoundingClientRect();
  const scale=Math.max(viewRect.width/video.videoWidth,viewRect.height/video.videoHeight);
  const drawnW=video.videoWidth*scale,drawnH=video.videoHeight*scale;
  const offsetX=(viewRect.width-drawnW)/2,offsetY=(viewRect.height-drawnH)/2;
  let sx=(frameRect.left-viewRect.left-offsetX)/scale,sy=(frameRect.top-viewRect.top-offsetY)/scale;
  let sw=frameRect.width/scale,sh=frameRect.height/scale;
  sx=Math.max(0,sx);sy=Math.max(0,sy);sw=Math.min(sw,video.videoWidth-sx);sh=Math.min(sh,video.videoHeight-sy);
  const max=1440, ratio=Math.min(1,max/Math.max(sw,sh)), canvas=document.createElement('canvas');
  canvas.width=Math.round(sw*ratio);canvas.height=Math.round(sh*ratio);canvas.getContext('2d').drawImage(video,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
  state[cameraSide+'Image']=canvas.toDataURL('image/jpeg',.82);closeCamera();renderImage(cameraSide);findDuplicates();toast(`已擷取名片${cameraSide==='front'?'正面':'背面'}範圍`)
}
function readForm(){ $$('[data-field]').forEach(i=>state[i.dataset.field]=i.type==='checkbox'?i.checked:i.value.trim());state.tags=state.tagsText.split(',').map(x=>x.trim()).filter(Boolean);state.updatedAt=Date.now() }
function normalizePhone(x){return String(x||'').replace(/\D/g,'')}function findDuplicates(){readForm();const phones=[normalizePhone(state.mobile),normalizePhone(state.tel)].filter(x=>x.length>5),email=safe(state.email);const dupes=cards.filter(c=>c.id!==activeId&&((email&&safe(c.email)===email)||phones.some(p=>p&&(normalizePhone(c.mobile)===p||normalizePhone(c.tel)===p))));const box=$('#duplicateBox');box.classList.toggle('hidden',!dupes.length);box.innerHTML=dupes.length?`可能重複：${dupes.map(c=>`<button data-open="${c.id}">${escapeHtml(c.name||c.company||'未命名')}</button>`).join('、')}<br><span class="small">請先確認，避免重複儲存。</span>`:'';$$('[data-open]').forEach(b=>b.onclick=()=>edit(b.dataset.open))}
function valid(){if(!state.name&&!state.company){toast('請至少填寫姓名或公司');return false}if(state.email&&!/^\S+@\S+\.\S+$/.test(state.email)){toast('Email 格式看起來不正確');return false}return true}
async function save(){readForm();if(!valid())return;const approx=JSON.stringify(state).length;if(approx>8*1024*1024){toast('這張名片圖片過大，請使用較小的照片');return}await put({...state,id:activeId||crypto.randomUUID()});toast('已儲存');home()}
function escapeV(v){return String(v||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,')}
function downloadVcard(){readForm();if(!valid())return;const name=state.name||state.company,parts=name.trim().split(/\s+/),family=parts.length>1?parts.pop():'',given=parts.join(' ')||name;let v=['BEGIN:VCARD','VERSION:3.0',`FN:${escapeV(name)}`,`N:${escapeV(family)};${escapeV(given)};;;`];if(state.company)v.push(`ORG:${escapeV(state.company)}`);if(state.jobTitle)v.push(`TITLE:${escapeV(state.jobTitle)}`);if(state.mobile)v.push(`TEL;TYPE=CELL:${escapeV(state.mobile)}`);if(state.tel)v.push(`TEL;TYPE=WORK:${escapeV(state.tel)}${state.extension?';'+escapeV(state.extension):''}`);if(state.fax)v.push(`TEL;TYPE=FAX:${escapeV(state.fax)}`);if(state.email)v.push(`EMAIL;TYPE=INTERNET:${escapeV(state.email)}`);if(state.website)v.push(`URL:${escapeV(state.website)}`);if(state.address)v.push(`ADR;TYPE=WORK:;;${escapeV(state.address)};;;;`);const note=[state.category,state.status,state.tags?.join('、'),state.note].filter(Boolean).join('｜');if(note)v.push(`NOTE:${escapeV(note)}`);v.push('END:VCARD');download(new Blob([v.join('\r\n')],{type:'text/vcard;charset=utf-8'}),`${name}.vcf`);toast('已下載聯絡人檔案')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},300)}
function exportData(){const clean=cards.map(({id,...c})=>({id,...c}));download(new Blob([JSON.stringify({app:'名脈 MingMai',version:2,exportedAt:new Date().toISOString(),cards:clean},null,2)],{type:'application/json'}),'mingmai-backup.json');toast('已匯出備份')}
async function importData(file){try{const raw=JSON.parse(await file.text()),incoming=Array.isArray(raw)?raw:raw.cards;if(!Array.isArray(incoming))throw Error();const existing=new Map(cards.map(c=>[c.id,c]));let add=0,replace=0;incoming.forEach(x=>{if(x&&typeof x==='object'){existing.has(x.id)?replace++:add++}});if(!confirm(`將匯入 ${add} 張新名片、更新 ${replace} 張同 ID 名片。要繼續嗎？`))return;showLoading('正在匯入備份…');for(const x of incoming)if(x&&typeof x==='object')await put({...defaults(),...x,id:x.id||crypto.randomUUID(),updatedAt:x.updatedAt||Date.now()});toast(`已匯入 ${add+replace} 張名片`)}catch{toast('無法讀取此備份檔')}finally{hideLoading()}}
async function getModels(){const key=aiKey.trim();if(!key)throw Error('請先輸入 API Key');const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);if(!r.ok){const x=await r.json().catch(()=>({}));throw Error(x.error?.message||`驗證失敗 (${r.status})`)}const j=await r.json();return j.models.filter(m=>m.supportedGenerationMethods?.includes('generateContent')).map(m=>m.name.replace('models/',''))}
async function testKey(){try{showLoading('正在確認 API Key…');models=await getModels();const sel=$('#model');sel.innerHTML=models.map(m=>`<option>${escapeHtml(m)}</option>`).join('');$('#keyStatus').textContent=`已載入 ${models.length} 個可用模型。`;toast('API Key 可使用')}catch(e){$('#keyStatus').textContent=e.message;toast('無法驗證 API Key')}finally{hideLoading()}}
function parseJson(text){const cleaned=text.replace(/```json|```/gi,'').trim();const a=cleaned.indexOf('{'),b=cleaned.lastIndexOf('}');return JSON.parse(cleaned.slice(a,b+1))}
async function scan(){if(!state.frontImage){toast('請先拍攝或選擇名片正面');return}if(!aiKey.trim()){openSettings();toast('請先在設定輸入 Gemini API Key');return}try{showLoading('AI 正在辨識名片…');if(!models.length)models=await getModels();let model=$('#model').value||models.find(x=>/flash/i.test(x))||models[0];const prompt='請從名片圖片擷取資料，僅回傳 JSON，不要 Markdown。欄位：name, jobTitle, company, mobile, tel, extension, fax, email, website, address, note。無法確定請留空字串。使用繁體中文保留原文。';const body={contents:[{parts:[{text:prompt},{inlineData:{mimeType:'image/jpeg',data:state.frontImage.split(',')[1]}}]}],generationConfig:{temperature:0.1,responseMimeType:'application/json'}};let r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(aiKey.trim())}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){const x=await r.json().catch(()=>({}));throw Error(x.error?.message||`辨識失敗 (${r.status})`)}const result=parseJson((await r.json()).candidates?.[0]?.content?.parts?.[0]?.text||'');for(const k of ['name','jobTitle','company','mobile','tel','extension','fax','email','website','address','note'])if(result[k]&&(!state[k]||confirm(`以 AI 辨識到的「${result[k]}」更新${k}？`)))state[k]=String(result[k]).trim();fillEditor();toast('辨識完成，請逐欄確認後儲存')}catch(e){toast(e.message||'辨識失敗')}finally{hideLoading()}}
function openSettings(){$('#settingsModal').classList.add('show');$('#apiKey').value=aiKey}function closeSettings(){$('#settingsModal').classList.remove('show');aiKey=$('#apiKey').value.trim()}
$('#addBtn').onclick=showEditor;$('#backBtn').onclick=home;$('#saveBtn').onclick=save;$('#vcardBtn').onclick=downloadVcard;$('#deleteBtn').onclick=async()=>{if(confirm('確定刪除這張名片？')){await del(activeId);toast('已刪除');home()}};$('#contactedBtn').onclick=()=>{state.lastContactedAt=Date.now();state.status='已聯絡';fillEditor();toast('已標記今天聯絡')};$('#scanBtn').onclick=scan;$('#settingsBtn').onclick=openSettings;$$('.close-modal').forEach(b=>b.onclick=closeSettings);$('#testKeyBtn').onclick=()=>{aiKey=$('#apiKey').value.trim();testKey()};$('#clearAllBtn').onclick=async()=>{if(confirm('這會永久刪除這台裝置上的所有名片。你已經匯出備份了嗎？')){await tx('readwrite',s=>s.clear());await load();closeSettings();toast('本機名片已清除')}};
$('#openFrontCamera').onclick=()=>openCamera('front');$('#openBackCamera').onclick=()=>openCamera('back');$('#cameraCancel').onclick=closeCamera;$('#cameraCapture').onclick=captureCard;
$('#search').oninput=renderHome;$('#search').oninput=()=>{renderHome()};$('#clearSearch').onclick=()=>{$('#search').value='';renderHome()};$('#sort').onchange=renderHome;$('#exportBtn').onclick=exportData;$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''};['front','back'].forEach(which=>{const slot=$('#'+which+'Slot');slot.querySelector('input').onchange=e=>{if(e.target.files[0])imageChange(which,e.target.files[0]);e.target.value=''};slot.querySelector('.remove-image').onclick=()=>{state[which+'Image']='';renderImage(which)}});$$('[data-field]').forEach(i=>i.oninput=()=>{readForm();findDuplicates()});
openDB().then(load).catch(()=>toast('無法開啟本機資料庫，請使用較新的瀏覽器'));
})();
</script>
